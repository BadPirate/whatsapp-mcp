name: Image

on:
  push:
    branches: [pcp]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: |
            ghcr.io/badpirate/whatsapp-mcp:${{ github.sha }}
            ghcr.io/badpirate/whatsapp-mcp:latest
          labels: |
            org.opencontainers.image.source=https://github.com/BadPirate/whatsapp-mcp
            org.opencontainers.image.revision=${{ github.sha }}
